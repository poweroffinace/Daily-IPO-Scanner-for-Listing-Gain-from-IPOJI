name: IPO Telegram Bot

on:
  schedule:
    # Existing: Runs at 10:00 AM UTC every day
    - cron: '0 10 * * *'
    # New: Runs every 2 hours on weekdays (Monday through Friday)
    - cron: '0 */2 * * 1-5'
  workflow_dispatch: # Allows you to trigger the workflow manually from the GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run IPO Script
        env:
          # Pulls your sensitive tokens from GitHub Secrets instead of hardcoding them
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
